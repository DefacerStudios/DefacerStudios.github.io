<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}Defacer Studios</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: 'Defacer Studios is an independent studio making games for phones and PC.' | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:title" content="{{ page.title | default: 'Defacer Studios' }}">
  <meta property="og:image" content="https://defacerstudios.github.io/assets/img/og.jpg">
  <meta property="og:url" content="https://defacerstudios.github.io{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#12151c">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/" aria-label="Defacer Studios home"><span class="cut" aria-hidden="true"><span class="a">Defacer</span><span class="b">Defacer</span></span></a>
      <nav class="nav" aria-label="Main">
        <a href="/#games">Games</a>
        <a href="/news/">News</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="block">
    <div class="wrap prose">
{{ content }}
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div>&copy; {{ site.time | date: "%Y" }} Defacer Studios. All rights reserved.</div>
      <div class="links">
        <a href="/">Home</a>
        <a href="/news/">News</a>
        <a href="/embersiege/privacy-policy">Ember Siege privacy policy</a>
      </div>
    </div>
  </footer>
</body>
</html>
